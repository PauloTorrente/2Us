# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=30000

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================
# SERVER
# ============================================
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=never
server.address=0.0.0.0

# ============================================
# JWT - Both naming conventions for compatibility
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================
# SPRING BOOT ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================
# REDIS - TEMPORARIAMENTE DESABILITADO
# ============================================
#spring.data.redis.host=${REDIS_HOST}
#spring.data.redis.port=${REDIS_PORT:6379}
#spring.data.redis.password=${REDIS_PASSWORD}
#spring.data.redis.ssl.enabled=true

# ============================================
# CACHE (optional)
# ============================================
app.cache.ttl-hours=24

# ============================================
# GOOGLE PLACES API
# ============================================
app.google.places.api-key=${GOOGLE_PLACES_API_KEY}

# ============================================
# TRIPADVISOR API (optional)
# ============================================
app.tripadvisor.api-key=${TRIPADVISOR_API_KEY:}

# ============================================
# LOGGING
# ============================================
logging.level.com.coupleapp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# SPRING DOC OPENAPI (SWAGGER)
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.persistAuthorization=true
